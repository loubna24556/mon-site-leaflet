<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Carte Interactive Leaflet</title>
  
  <!-- CSS de Leaflet (requis) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Style de base pour la page et la carte */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    header {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    #map {
      height: calc(100vh - 70px); /* Prend toute la hauteur restante */
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mon Site Web avec Leaflet JS</h1>
  </header>

  <!-- Élément HTML qui contiendra la carte -->
  <div id="map"></div>

  <!-- JavaScript de Leaflet (requis) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Initialiser la carte (Coordonnées [Latitude, Longitude], Niveau de zoom)
    // Exemple : Paris (48.8566, 2.3522)
    const map = L.map('map').setView([48.8566, 2.3522], 13);

    // 2. Ajouter les tuiles d'arrière-plan OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 3. Ajouter un marqueur à la carte
    const marker = L.marker([48.8566, 2.3522]).addTo(map);

    // 4. Ajouter une bulle d'information (Popup)
    marker.bindPopup("<b>Bonjour !</b><br>Ceci est Paris.").openPopup();
  </script>

</body>
</html>
