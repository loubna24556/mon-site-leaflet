<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Carte Interactive - IAV Rabat</title>
  
  <!-- CSS de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    header {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    #map {
      height: calc(100vh - 70px);
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Carte interactive - Campus IAV Rabat</h1>
  </header>

  <div id="map"></div>

  <!-- JavaScript de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Initialiser la carte centrée sur Rabat
    const map = L.map('map').setView([34.0209, -6.8416], 15);

    // 2. Ajouter un fond de carte Esri gratuit (sans clé API)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    // 3. Charger et afficher le fichier GeoJSON
    fetch('departement.geojson')
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, {
          style: function (feature) {
            return { color: "#ff7800", weight: 2, fillOpacity: 0.4 };
          },
          onEachFeature: function (feature, layer) {
            if (feature.properties && feature.properties.nom) {
              layer.bindPopup("<b>Département : </b>" + feature.properties.nom);
            }
          }
        }).addTo(map);
      })
      .catch(error => console.error('Erreur lors du chargement du GeoJSON :', error));
  </script>

</body>
</html>
