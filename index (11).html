<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Site Web - Campus IAV Rabat</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    header {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 15px;
      height: 40px;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
    }
    /* L'iframe prend tout l'espace restant sous l'en-tête */
    iframe {
      width: 100%;
      height: calc(100vh - 70px);
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Carte interactive - Campus IAV Rabat</h1>
  </header>

  <!-- Intégration de votre page iav.html propre dans l'en-tête -->
  <iframe src="iav.html"></iframe>

</body>
</html>
