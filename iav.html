<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Carte Campus IAV Rabat</title>

  <!-- Feuilles de style de votre projet -->
  <link rel="stylesheet" href="resources/ol.css">
  <link rel="stylesheet" href="resources/fontawesome-all.min.css">
  <link rel="stylesheet" href="resources/photon-geocoder-autocomplete.min.css">
  <link rel="stylesheet" href="resources/ol-layerswitcher.css">
  <link rel="stylesheet" href="resources/qgis2web.css">

  <style>
    html, body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Scripts nécessaires -->
  <script src="resources/qgis2web_expressions.js"></script>
  <script src="resources/polyfills.js"></script>
  <script src="resources/functions.js"></script>
  <script src="resources/ol.js"></script>
  <script src="resources/photon-geocoder-autocomplete.min.js"></script>
  <script src="resources/ol-layerswitcher.js"></script>
  
  <!-- Vos couches et scripts de données -->
  <script src="layers/CampusIAVRabat_1.js"></script>
  <script src="styles/CampusIAVRabat_1_style.js"></script>
  <script src="sw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol-mapbox-style@10.1.0/dist/olms.js"></script>
  <script src="layers/layers.js" type="text/javascript"></script> 
  <script src="resources/Autolinker.min.js"></script>
  <script src="resources/qgis2web.js"></script>

  <script>
    // Correction du fond de carte pour éviter le blocage OpenStreetMap
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        if (typeof map !== 'undefined') {
          map.getLayers().forEach(function(layer) {
            if (layer instanceof ol.layer.Tile && layer.getSource() instanceof ol.source.OSM) {
              layer.setSource(new ol.source.XYZ({
                url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
                attributions: '© CARTO'
              }));
            }
          });
        }
      }, 500);
    });
  </script>
</body>
</html>
